seed: 42
dataset:
  samples: 600
  noise: 0.12
  inner_radius: 0.7
  outer_radius: 1.7
  train_fraction: 0.70
  validation_fraction: 0.15
  class_names: [inner_ring, outer_ring]
model:
  input_dim: 2
  hidden_dim: 16
  num_classes: 2
training:
  batch_size: 32
  epochs: 30
  learning_rate: 0.01
  weight_decay: 0.0001
  num_workers: 0
  device: cpu
  num_threads: 1
paths:
  raw: data/raw/rings.csv
  processed: data/processed
  split: data/split
  checkpoint: checkpoints/best.pt
