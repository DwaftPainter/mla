[project]
name = "nucle-error-type-classification"
version = "0.1.0"
description = "Group-aware NUCLE grammatical error-type classification pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13.8"
dependencies = [
    "torch>=2.6,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=2.1,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy==1.26.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "requests>=2.34.2",
    "lxml>=6.1.3",
    "bs4>=0.0.2",
    "pandas>=3.0.6",
    "matplotlib>=3.9,<4",
    "spacy==3.8.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # spaCy 3.8.7 imports Click APIs; newer Typer releases removed that dependency.
    "typer>=0.12,<0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]
